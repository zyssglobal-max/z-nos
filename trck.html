<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Z-NOS Track</title>
    <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
    <style>
        body {
            background: transparent;
            margin: 0;
            padding: 0;
            width: 0;
            height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <script>
    (function() {
        const TRACKING_NPUB = 'npub1qyxgmwnezazde84lqjz3l6k38f5pglax7ltyhq4kzd3p8s3j53pql2nuek';
        const RELAYS = ['wss://nostr.mom', 'wss://relay.damus.io', 'wss://nos.lol', 'wss://vault.iris.to'];
        let lastPingTime = 0;
        let lastVersion = null;
        function waitForParentDOM() {
            return new Promise((resolve) => {
                if (!window.parent) {
                    resolve(false);
                    return;
                }
                let attempts = 0;
                const maxAttempts = 20;
                const checkInterval = setInterval(() => {
                    attempts++;
                    const isReady = window.parent.document.readyState === 'complete';
                    const hasContent = window.parent.document.body && 
                                      window.parent.document.body.children.length > 0;
                    if (isReady || attempts >= maxAttempts) {
                        clearInterval(checkInterval);
                        resolve(hasContent);
                    }
                }, 500);
            });
        }
        function getRealVersion() {
            try {
                if (!window.parent || !window.parent.document) {
                    console.log('⚠️ No hay acceso al padre');
                    return null;
                }
                const labels = window.parent.document.querySelectorAll('label');
                for (let label of labels) {
                    const text = label.textContent || '';
                    if (text.includes('vREV0') || text.includes('✦')) {
                        const match = text.match(/([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)/);
                        if (match && match[1]) {
                            console.log('✅ Versión encontrada en label:', match[1]);
                            return match[1];
                        }
                    }
                }
                const allElements = window.parent.document.querySelectorAll('*');
                for (let el of allElements) {
                    if (el.children.length === 0 && el.textContent) {
                        const text = el.textContent.trim();
                        if (text.match(/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/)) {
                            console.log('✅ Versión encontrada en elemento:', text);
                            return text;
                        }
                    }
                }
                const storedVersion = window.parent.localStorage.getItem('app_version');
                if (storedVersion && storedVersion.match(/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/)) {
                    console.log('✅ Versión encontrada en localStorage:', storedVersion);
                    return storedVersion;
                }
                console.log('⚠️ No se encontró versión');
                return null;
            } catch (e) {
                console.error('Error obteniendo versión:', e);
                return null;
            }
        }
        function getRealUserNpub() {
            try {
                if (!window.parent) {
                    console.log('No hay window.parent');
                    return null;
                }
                if (window.parent.appState && window.parent.appState.myNpub) {
                    const npub = window.parent.appState.myNpub;
                    if (npub && npub.startsWith('npub1')) {
                        console.log('✅ Usuario encontrado en appState:', npub.substring(0, 20) + '...');
                        return npub;
                    }
                }
                try {
                    const localNpub = window.parent.localStorage.getItem('myNpub');
                    if (localNpub && localNpub.startsWith('npub1')) {
                        console.log('✅ Usuario encontrado en localStorage padre:', localNpub.substring(0, 20) + '...');
                        return localNpub;
                    }
                } catch(e) {}
                const npubInput = window.parent.document.getElementById('myNpub');
                if (npubInput && npubInput.value && npubInput.value.startsWith('npub1')) {
                    console.log('✅ Usuario encontrado en input:', npubInput.value.substring(0, 20) + '...');
                    return npubInput.value;
                }
                const userDisplay = window.parent.document.getElementById('userPubkeyDisplay');
                if (userDisplay && userDisplay.textContent && userDisplay.textContent !== 'No conectado') {
                    const text = userDisplay.textContent;
                    if (text.includes('npub1')) {
                        const match = text.match(/npub1[a-z0-9]+/);
                        if (match) {
                            console.log('✅ Usuario encontrado en display:', match[0].substring(0, 20) + '...');
                            return match[0];
                        }
                    }
                }
                console.log('⚠️ No se encontró usuario');
                return null; 
            } catch (e) {
                console.error('Error obteniendo usuario:', e);
                return null;
            }
        }
        function sendPing(force = false) {
            if (typeof window.NostrTools === 'undefined') {
                console.log('⏳ Esperando NostrTools...');
                setTimeout(() => sendPing(force), 500);
                return;
            }
            try {
                const version = getRealVersion();
                const userNpub = getRealUserNpub();
                if (!version) {
                    console.log('❌ No se envió ping - sin versión detectada');
                    return;
                }
                const now = Date.now();
                if (!force && lastVersion === version && (now - lastPingTime) < 30000) {
                    console.log('⏱️ Ping reciente con misma versión, omitiendo');
                    return;
                }
                console.log('📊 Enviando ping con datos REALES:', { 
                    version, 
                    user: userNpub ? userNpub.substring(0, 20) + '...' : 'anónimo',
                    force: force
                });
                const decoded = window.NostrTools.nip19.decode(TRACKING_NPUB);
                const trackingPubkeyHex = decoded.data;
                let privkey = localStorage.getItem('track_priv');
                if (!privkey) {
                    privkey = window.NostrTools.generatePrivateKey();
                    localStorage.setItem('track_priv', privkey);
                }
                const event = {
                    kind: 1,
                    created_at: Math.floor(Date.now() / 1000),
                    tags: [
                        ['p', trackingPubkeyHex],
                        ['z-nos-track', 'v1'],
                        ['version', version],
                        ['type', 'ping'],
                        ['client', 'z-nos']
                    ],
                    content: JSON.stringify({
                        type: 'z-nos-ping',
                        version: version,
                        user: userNpub || '', 
                        hasUser: !!userNpub,
                        timestamp: Date.now(),
                        pageLoad: true,
                        userAgent: navigator.userAgent,
                        url: window.parent ? window.parent.location.href : window.location.href,
                        screen: `${window.screen.width}x${window.screen.height}`,
                        time: new Date().toISOString()
                    })
                };
                const signed = window.NostrTools.finishEvent(event, privkey);
                let enviados = 0;
                function enviarSiguiente(index) {
                    if (index >= RELAYS.length) {
                        if (enviados > 0) {
                            console.log('✅ Ping enviado con versión:', version);
                            lastVersion = version;
                            lastPingTime = now;
                            localStorage.setItem('track_last_ping', now.toString());
                            localStorage.setItem('track_last_version', version);
                        }
                        return;
                    }
                    const relay = RELAYS[index];
                    try {
                        const ws = new WebSocket(relay);
                        const timeout = setTimeout(() => {
                            ws.close();
                            enviarSiguiente(index + 1);
                        }, 2000);
                        ws.onopen = () => {
                            clearTimeout(timeout);
                            ws.send(JSON.stringify(["EVENT", signed]));
                            enviados++;
                            setTimeout(() => {
                                ws.close();
                                enviarSiguiente(index + 1);
                            }, 500);
                        };
                        ws.onerror = () => {
                            clearTimeout(timeout);
                            enviarSiguiente(index + 1);
                        };
                    } catch(e) {
                        enviarSiguiente(index + 1);
                    }
                }
                enviarSiguiente(0);
            } catch (e) {
                console.error('Error en tracking:', e);
            }
        }
        function setupParentObserver() {
            if (!window.parent || !window.parent.document) return;
            const observer = new MutationObserver((mutations) => {
                const hasVersion = window.parent.document.querySelector('label') && 
                                  window.parent.document.querySelector('label').textContent.includes('vREV0');
                const hasUser = window.parent.document.getElementById('userPubkeyDisplay') && 
                               window.parent.document.getElementById('userPubkeyDisplay').textContent !== 'No conectado';
                if (hasVersion || hasUser) {
                    console.log('🔄 Detectado cambio en el DOM padre');
                    sendPing(true); 
                }
            });
            observer.observe(window.parent.document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        }
        async function initTracking() {
            console.log('📊 Tracking iniciado - Esperando DOM padre...');
            const parentReady = await waitForParentDOM();
            if (parentReady) {
                console.log('✅ DOM padre listo');
                setTimeout(() => {
                    sendPing(true);
                }, 1000);
                setupParentObserver();
                setInterval(() => {
                    const currentVersion = getRealVersion();
                    if (currentVersion && currentVersion !== lastVersion) {
                        console.log('🔄 Versión cambiada, enviando ping');
                        sendPing(true);
                    } else if (!lastVersion && currentVersion) {
                        sendPing(true);
                    } else {
                        const now = Date.now();
                        if (now - lastPingTime > 120000) {
                            sendPing(true);
                        }
                    }
                }, 30000);
                window.addEventListener('message', (event) => {
                    if (event.data && event.data.type === 'Z_NOS_VERSION_CHANGED') {
                        console.log('📡 Recibida notificación de cambio de versión');
                        sendPing(true);
                    }
                });
            } else {
                console.log('⚠️ No se pudo acceder al DOM padre');
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initTracking);
        } else {
            initTracking();
        }
    })();
    </script>
</body>
</html>
